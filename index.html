<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Aula Virtual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#6366f1;
  --bg:#f3f4f8;--surface:#fff;--surface-2:#f8f9fc;--surface-3:#eef0f6;
  --text:#151923;--muted:#5f6878;--faint:#9aa1af;--border:#e6e8ef;
  --ok:#12a150;--warn:#d97706;--bad:#e5484d;--info:#2f80ed;--neu:#7c8494;
  --shadow-sm:0 1px 2px rgba(20,24,40,.05);
  --shadow:0 1px 2px rgba(20,24,40,.04),0 6px 20px rgba(20,24,40,.06);
  --shadow-lg:0 24px 60px rgba(15,18,30,.22);
  --scrim:rgba(12,14,22,.45);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0d12;--surface:#13161d;--surface-2:#171a22;--surface-3:#1f232d;
  --text:#e9ebf1;--muted:#9ca4b3;--faint:#687082;--border:#252a35;
  --ok:#3dd68c;--warn:#ffb224;--bad:#ff6369;--info:#5aa2ff;--neu:#8b93a3;
  --shadow-sm:none;--shadow:none;--shadow-lg:0 24px 60px rgba(0,0,0,.6);--scrim:rgba(0,0,0,.6);color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0b0d12;--surface:#13161d;--surface-2:#171a22;--surface-3:#1f232d;
  --text:#e9ebf1;--muted:#9ca4b3;--faint:#687082;--border:#252a35;
  --ok:#3dd68c;--warn:#ffb224;--bad:#ff6369;--info:#5aa2ff;--neu:#8b93a3;
  --shadow-sm:none;--shadow:none;--shadow-lg:0 24px 60px rgba(0,0,0,.6);--scrim:rgba(0,0,0,.6);color-scheme:dark;}
:root{--accent-soft:color-mix(in srgb,var(--accent) 13%,transparent);--accent-2:color-mix(in srgb,var(--accent) 55%,#ec4899)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14.5px/1.5 'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
.i{width:18px;height:18px;flex:0 0 auto}
.i.sm{width:15px;height:15px}.i.lg{width:22px;height:22px}
h1,h2,h3,h4{margin:0;letter-spacing:-.01em}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--border);padding:18px 14px;display:flex;flex-direction:column;gap:2px;z-index:50}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 16px;font-weight:800;font-size:16.5px}
.brand small{display:block;font-size:11.5px;font-weight:600;color:var(--muted)}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 35%,transparent)}
.grp{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);padding:14px 10px 6px;font-weight:700}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:10px;color:var(--muted);font-weight:600;font-size:14px;text-decoration:none;transition:background .15s,color .15s}
.nav a:hover{background:var(--surface-3);color:var(--text)}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;font-size:11.5px;font-weight:700;display:inline-grid;place-items:center;background:var(--surface-3);color:var(--muted)}
.badge.bad{background:var(--bad);color:#fff}.badge.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:12px 8px 2px;border-top:1px solid var(--border)}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2));flex:0 0 auto}
.me .n{font-weight:700;font-size:13.5px;line-height:1.25}.me .s{font-size:12px;color:var(--muted)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:16px 32px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.topbar .ttl{min-width:0;flex:1}
.topbar h1{font-size:22px;font-weight:800}
.topbar .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.searchbtn{display:flex;align-items:center;gap:8px;width:280px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:8px 12px;color:var(--faint);cursor:pointer;text-align:left}
.searchbtn kbd{margin-left:auto;font:600 11px/1 inherit;background:var(--surface-3);border-radius:6px;padding:4px 6px;color:var(--muted)}
.page{padding:6px 32px 56px;max-width:1320px;width:100%}
.btn.menu-btn{display:none}
@media (max-width:1100px){.searchbtn{width:40px;height:40px;padding:0;justify-content:center}.searchbtn span:not(.sico),.searchbtn kbd{display:none}.searchbtn .sico{display:inline-flex}}
@media (max-width:960px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi{padding:14px;gap:10px}.kpi .ico{width:38px;height:38px}.kpi .n{font-size:22px}
  .side{position:fixed;left:0;top:0;width:272px;transform:translateX(-102%);transition:transform .25s ease}
  .side.open{transform:none;box-shadow:var(--shadow-lg)}
  .btn.menu-btn{display:inline-flex}
  .topbar{padding:12px 16px}.topbar h1{font-size:19px}
  .page{padding:4px 16px 48px}
}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow-sm)}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 4px}
.ch h3{font-size:15px;font-weight:700;display:flex;gap:9px;align-items:center}
.ch h3 .i{color:var(--accent)}
.ch a,.ch .lnk{font-size:13px;font-weight:600}
.cb{padding:10px 18px 18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--border);background:var(--surface);padding:8px 14px;border-radius:11px;font-weight:600;font-size:14px;cursor:pointer;color:var(--text);text-decoration:none!important;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{background:var(--surface-3)}.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--accent);border-color:transparent;color:#fff}.btn.pri:hover{background:color-mix(in srgb,var(--accent) 88%,#000)}
.btn.ghost{background:transparent;border-color:transparent}.btn.ghost:hover{background:var(--surface-3)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:9px}
.btn.icon{width:40px;height:40px;padding:0}
.btn.icon.sm{width:32px;height:32px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;pointer-events:none}
.spinning .i{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.inp{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:8px 12px;min-width:0;outline:none;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inpw{position:relative;display:flex;align-items:center}
.inpw .i{position:absolute;left:11px;color:var(--faint);pointer-events:none}
.inpw .inp{padding-left:36px;width:100%}
.chip{--c:var(--neu);display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);white-space:nowrap;line-height:1.5}
.chip .i{width:13px;height:13px}
.ok{--c:var(--ok)}.warn{--c:var(--warn)}.bad{--c:var(--bad)}.info{--c:var(--info)}.neu{--c:var(--neu)}.acc{--c:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block;flex:0 0 auto}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.sp{flex:1}
.seg{display:inline-flex;background:var(--surface-3);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;color:var(--muted);padding:28px 12px;font-size:14px}
.empty .i{width:34px;height:34px;color:var(--faint)}
.skel{background:linear-gradient(90deg,var(--surface-3),var(--surface-2),var(--surface-3));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:8px;height:14px}
@keyframes sk{to{background-position:-200% 0}}
.bar{height:7px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c,var(--accent))}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar .inpw{flex:1 1 220px}
.sect-t{display:flex;align-items:center;gap:10px;margin:24px 0 12px;font-size:15px;font-weight:700}
.sect-t .badge{margin-left:0}
.grid{display:grid;gap:16px}
.g-2{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.g-2e{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1100px){.g-2,.g-2e{grid-template-columns:minmax(0,1fr)}}
.mt{margin-top:16px}

/* ---------- hero / kpis ---------- */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:28px 30px;color:#fff;background:linear-gradient(125deg,var(--accent) 0%,var(--accent-2) 100%);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;box-shadow:0 18px 40px color-mix(in srgb,var(--accent) 28%,transparent)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.1);pointer-events:none}
.hero::before{width:340px;height:340px;right:-90px;top:-150px}
.hero::after{width:220px;height:220px;left:38%;bottom:-150px}
.hero>*{position:relative;z-index:1}
.eyebrow{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;opacity:.85}
.hero h2{font-size:30px;font-weight:800;margin:6px 0 8px}
.hero p{margin:0;opacity:.92;max-width:560px;font-size:15px}
.hero .acts{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.glass{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);color:#fff;backdrop-filter:blur(6px)}
.btn.glass:hover{background:rgba(255,255,255,.26)}
.cdbox{border-radius:18px;padding:16px 18px;min-width:300px;max-width:340px}
.cdbox .lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;opacity:.85}
.cdbox .tt{font-weight:700;font-size:15px;margin:4px 0 2px;line-height:1.3}
.cdbox .cc{font-size:12.5px;opacity:.85}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.cd div{background:rgba(255,255,255,.16);border-radius:12px;padding:8px 0;text-align:center}
.cd b{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.cd span{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;opacity:.85}
@media (max-width:820px){.hero{grid-template-columns:1fr;padding:22px}.hero h2{font-size:24px}.cdbox{min-width:0;max-width:none}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:14px;margin:18px 0}
.kpi{padding:16px 18px;display:flex;gap:14px;align-items:center;text-decoration:none!important;color:var(--text);transition:transform .15s,box-shadow .15s}
a.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.kpi .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);flex:0 0 auto}
.kpi .n{font-size:26px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--muted);font-weight:500}

/* ---------- charts ---------- */
.donutw{display:flex;gap:22px;align-items:center;flex-wrap:wrap;justify-content:center}
.legend{display:flex;flex-direction:column;gap:9px;min-width:170px}
.legend div{display:flex;align-items:center;gap:9px;font-size:13.5px}
.legend b{margin-left:auto;font-variant-numeric:tabular-nums}
svg text{font-family:inherit}
.chart{width:100%;height:auto;display:block}

/* ---------- timeline ---------- */
.tl{--c:var(--accent);display:flex;gap:13px;align-items:center;padding:10px 6px;border-radius:12px;cursor:default}
.tl+.tl{margin-top:2px}
.tl.click{cursor:pointer}.tl.click:hover{background:var(--surface-2)}
.tl.done{opacity:.6}
.dbadge{flex:0 0 50px;text-align:center;border-radius:13px;padding:6px 0 7px;background:color-mix(in srgb,var(--c) 13%,transparent);color:var(--c)}
.dbadge span{display:block;font-size:10.5px;text-transform:uppercase;font-weight:800;letter-spacing:.05em}
.dbadge b{display:block;font-size:19px;line-height:1;font-weight:800}
.tlb{flex:1;min-width:0}
.tlt{font-weight:600;overflow-wrap:anywhere;line-height:1.35}
.tlt a{color:var(--text)}
.meta{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:2px}
.urg{color:var(--bad);font-weight:700}

/* ---------- tasks ---------- */
.tgroup{overflow:hidden}
.trow{--c:var(--accent);display:grid;grid-template-columns:4px minmax(0,1fr) 150px 150px 110px 32px;gap:14px;align-items:center;padding:12px 16px 12px 0;border-top:1px solid var(--border);cursor:pointer;transition:background .12s}
.trow:first-child{border-top:0}
.trow:hover{background:var(--surface-2)}
.trow .cbar{align-self:stretch;background:var(--c);border-radius:0 4px 4px 0}
.trow .tn{font-weight:600;overflow-wrap:anywhere}
.trow .due{font-size:13px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.trow .due small{display:block;color:var(--muted);font-size:12px}
.trow .gr{min-width:70px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;font-size:13.5px}
.trow .hide{opacity:0;transition:opacity .15s}
.trow:hover .hide{opacity:1}
.trow .stc{text-align:right}
@media (max-width:1100px){.trow{grid-template-columns:4px minmax(0,1fr) 130px 140px 100px 32px}}
@media (max-width:720px){.trow{grid-template-columns:4px minmax(0,1fr) auto auto;gap:10px}.trow .due,.trow .hide,.trow .ext{display:none}.trow .gr{min-width:0}}
.toolbar select.inp{flex:0 1 260px}
.kanban{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:14px;overflow-x:auto;padding-bottom:8px}
.kcol{background:var(--surface-2);border:1px solid var(--border);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:120px}
.kcol h4{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:2px 4px}
.kcard{--c:var(--accent);background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--c);border-radius:12px;padding:10px 12px;cursor:pointer;transition:transform .12s,box-shadow .12s}
.kcard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.kcard .tn{font-weight:600;font-size:13.5px;line-height:1.35;overflow-wrap:anywhere}

/* ---------- courses ---------- */
.courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.course{overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.course:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.cimg{--c:var(--accent);height:118px;position:relative;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 45%,#0b1020));background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:12px 14px}
.cimg .ab{font-weight:800;font-size:13px;color:#fff;background:rgba(0,0,0,.28);backdrop-filter:blur(4px);padding:3px 10px;border-radius:999px}
.course .cbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.course .cn{font-weight:700;font-size:15px;line-height:1.3}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.ring{position:relative;width:54px;height:54px;flex:0 0 auto}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:12.5px;font-weight:800}

/* ---------- calendar ---------- */
.calw{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px}
@media (max-width:1100px){.calw{grid-template-columns:1fr}}
.calh{display:flex;align-items:center;gap:8px;padding:14px 16px}
.calh h3{font-size:18px;font-weight:800;flex:1}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--border)}
.cal .dow{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);padding:8px 10px;border-bottom:1px solid var(--border)}
.cell{min-height:104px;padding:6px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0;transition:background .12s}
.cell:nth-child(7n){border-right:0}
.cell:hover{background:var(--surface-2)}
.cell.out{background:var(--surface-2)}.cell.out .num{color:var(--faint)}
.cell.sel{background:var(--accent-soft)}
.num{font-size:12.5px;font-weight:700;width:26px;height:26px;display:grid;place-items:center;border-radius:50%}
.cell.today .num{background:var(--accent);color:#fff}
.pill{--c:var(--accent);font-size:11.5px;font-weight:600;padding:2px 6px;border-radius:6px;background:color-mix(in srgb,var(--c) 15%,transparent);border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.45}
.pill.done{opacity:.5;text-decoration:line-through}
.more{font-size:11px;color:var(--muted);font-weight:600;padding-left:4px}
.dots{display:none;gap:3px;flex-wrap:wrap;padding-left:4px}
@media (max-width:720px){.cell{min-height:58px;padding:4px}.pill,.more{display:none}.dots{display:flex}}

/* ---------- materials ---------- */
.cchips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:thin}
.cchip{--c:var(--accent);display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;color:var(--text)}
.cchip.on{background:color-mix(in srgb,var(--c) 14%,var(--surface));border-color:var(--c)}
details.sec{margin-bottom:12px}
details.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 18px;font-weight:700}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .chev{transition:transform .2s;color:var(--faint)}
details.sec[open]>summary .chev{transform:rotate(90deg)}
.mod{display:flex;gap:12px;align-items:flex-start;padding:10px 18px;border-top:1px solid var(--border)}
.ftile{--c:var(--neu);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);font-size:10px;font-weight:800;text-transform:uppercase}
.files{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.file{display:flex;align-items:center;gap:10px;font-size:13.5px}
.file .fs{color:var(--faint);font-size:12px;white-space:nowrap}
.lnk{color:var(--accent);cursor:pointer;font-weight:600}.lnk:hover{text-decoration:underline}

/* ---------- feed / messages / notifications ---------- */
.post{padding:18px 20px}
.post+.post{margin-top:14px}
.post h4{font-size:16px;font-weight:700;margin:8px 0 4px}
.rich{font-size:14px;line-height:1.6;overflow-wrap:anywhere}
.rich img{max-width:100%;max-height:380px;width:auto;height:auto;object-fit:contain;border-radius:10px;display:block}
.rich p{margin:.45em 0}.rich ul,.rich ol{padding-left:22px}
.rich table{border-collapse:collapse;max-width:100%;display:block;overflow-x:auto}.rich td,.rich th{border:1px solid var(--border);padding:4px 8px}
.clamp{max-height:9.6em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 65%,transparent)}
.msgw{display:grid;grid-template-columns:320px minmax(0,1fr);height:calc(100vh - 140px);min-height:480px;overflow:hidden}
@media (max-width:820px){.msgw{grid-template-columns:1fr;height:auto}.msgw.has .clist{display:none}.msgw:not(.has) .thread{display:none}}
.clist{border-right:1px solid var(--border);overflow-y:auto}
.conv{display:flex;gap:11px;align-items:center;padding:12px 14px;cursor:pointer;border-bottom:1px solid var(--border)}
.conv:hover{background:var(--surface-2)}.conv.on{background:var(--accent-soft)}
.conv .cn{font-weight:700;font-size:14px}.conv .lm{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread{display:flex;flex-direction:column;min-height:0}
.thead{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;font-weight:700}
.msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:8px;min-height:240px}
.bub{max-width:76%;padding:9px 13px;border-radius:16px;background:var(--surface-3);font-size:14px;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:5px}
.bub:not(.me){border-bottom-left-radius:5px}
.bub .t{font-size:11px;opacity:.7;margin-top:3px}
.bub.me a{color:#fff;text-decoration:underline}
.reply{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border)}
.reply textarea{flex:1;resize:none;height:44px}
.notif{display:flex;gap:13px;padding:14px 18px;border-top:1px solid var(--border);align-items:flex-start}
.notif:first-child{border-top:0}
.notif .ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);flex:0 0 auto}
.notif.unread{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.notif .s{font-weight:600;line-height:1.35}
.udot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:0 0 auto;margin-top:6px}

/* ---------- grades ---------- */
.gtable{width:100%;border-collapse:collapse;font-size:13.5px}
.gtable td{padding:9px 6px;border-top:1px solid var(--border);vertical-align:middle}
.gtable tr.cat td{font-weight:700;background:var(--surface-2)}
.gtable tr.tot td{font-weight:800;font-size:14px}
.gtable .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.gtable .pb{width:120px}
@media (max-width:640px){.gtable .pb,.gtable .rng{display:none}}
.fb{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
details.gc{overflow:hidden}
details.gc>summary{list-style:none;cursor:pointer;display:flex;gap:14px;align-items:center;padding:14px 18px}
details.gc>summary::-webkit-details-marker{display:none}
details.gc .big{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;margin-left:auto;white-space:nowrap}

/* ---------- todo / settings ---------- */
.todo{display:flex;gap:12px;align-items:center;padding:11px 16px;border-top:1px solid var(--border)}
.todo:first-child{border-top:0}
.todo.done .tx{text-decoration:line-through;color:var(--faint)}
.check{width:22px;height:22px;border-radius:7px;border:2px solid var(--border);display:grid;place-items:center;cursor:pointer;background:none;padding:0;flex:0 0 auto;color:#fff}
.todo.done .check{background:var(--ok);border-color:var(--ok)}
.setrow{display:flex;align-items:center;gap:16px;padding:16px 18px;border-top:1px solid var(--border);flex-wrap:wrap}
.setrow:first-child{border-top:0}
.setrow .lb{flex:1 1 240px}.setrow .lb b{display:block}.setrow .lb span{font-size:13px;color:var(--muted)}
.sw{position:relative;width:44px;height:26px;flex:0 0 auto}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;background:var(--surface-3);border:1px solid var(--border);border-radius:99px;cursor:pointer;transition:.2s}
.sw span::after{content:"";position:absolute;width:20px;height:20px;left:2px;top:2px;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.sw input:checked+span{background:var(--accent);border-color:var(--accent)}
.sw input:checked+span::after{transform:translateX(18px)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:30px;height:30px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--border);cursor:pointer;padding:0}
.swatch.on{box-shadow:0 0 0 2px var(--text)}
input[type=color]{width:34px;height:30px;border:1px solid var(--border);border-radius:8px;padding:2px;background:var(--surface);cursor:pointer}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:55;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(580px,100vw);background:var(--surface);z-index:60;box-shadow:var(--shadow-lg);transform:translateX(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);overflow-y:auto;display:flex;flex-direction:column}
.drawer.open{transform:none}
.dhead{--c:var(--accent);padding:22px 24px 18px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 18%,var(--surface)),var(--surface));border-bottom:1px solid var(--border);position:sticky;top:0;z-index:1}
.dhead h2{font-size:21px;font-weight:800;margin:10px 0 10px;line-height:1.25}
.dbody{padding:20px 24px 32px;display:flex;flex-direction:column;gap:20px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fact{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
.fact span{display:block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--faint)}
.fact b{font-size:14px}
.dsec h4{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);margin-bottom:8px}
.modal{position:fixed;inset:0;z-index:80;display:flex;justify-content:center;align-items:flex-start;padding:10vh 16px 16px;background:var(--scrim)}
.sbox{width:min(660px,100%);max-height:72vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow-lg)}
.sbox .inpw{padding:12px;border-bottom:1px solid var(--border)}
.sbox .inpw .i{left:24px}
.sbox .inp{border:0;box-shadow:none!important;font-size:16px}
.sres{overflow-y:auto;padding:6px}
.sr{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;cursor:pointer}
.sr:hover,.sr.on{background:var(--surface-3)}
.sr .k{font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase;margin-left:auto}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:600;font-size:14px;z-index:90;opacity:0;transition:.25s;pointer-events:none;box-shadow:var(--shadow-lg)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.loadbar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent-2));z-index:100;transition:width .3s,opacity .4s;width:0}

const ic = (n, c = '') => `<svg class="i ${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICONS[n] || ICONS.file}"/></svg>`;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const txt = h => { if (h == null || h === '') return ''; const d = new DOMParser().parseFromString(String(h), 'text/html'); return (d.body.textContent || '').replace(/\s+/g, ' ').trim(); };
const store = {
  get(k){ try { return localStorage.getItem(k) ?? sessionStorage.getItem(k); } catch { return null; } },
  set(k, v, p = true){ try { (p ? localStorage : sessionStorage).setItem(k, v); } catch {} },
  del(k){ try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch {} }
};
const jget = (k, d) => { try { return JSON.parse(store.get(k)) ?? d; } catch { return d; } };

const DEF = { theme:'auto', accent:'#6366f1', hideOld:true, hidden:[], refresh:0, cnames:{}, cshort:{}, ccolors:{}, view:'list' };
let CFG = Object.assign({}, DEF, jget('mv_settings', {}));
const saveCfg = () => store.set('mv_settings', JSON.stringify(CFG));
let TODOS = jget('mv_todos', []);
const saveTodos = () => store.set('mv_todos', JSON.stringify(TODOS));

let SITE = (window.MOODLE_SITE || store.get('mv_site') || 'https://centros.edu.xunta.gal/iesteis/aulavirtual').replace(/\/+$/, '');
let TOKEN = window.MOODLE_TOKEN || store.get('mv_token');

const PALETTE = ['#6366f1','#f97316','#10b981','#ef4444','#8b5cf6','#0ea5e9','#eab308','#ec4899','#14b8a6','#a16207','#64748b'];
const ACCENTS = ['#6366f1','#2563eb','#0891b2','#059669','#d97706','#e11d48','#c026d3','#7c3aed'];

function addParam(u, k, v){
  if (Array.isArray(v)) v.forEach((x, i) => addParam(u, `${k}[${i}]`, x));
  else if (v && typeof v === 'object') Object.entries(v).forEach(([kk, vv]) => addParam(u, `${k}[${kk}]`, vv));
  else u.searchParams.append(k, v);
}
async function api(fn, params = {}){
  const u = new URL(SITE + '/webservice/rest/server.php');
  addParam(u, 'wstoken', TOKEN); addParam(u, 'moodlewsrestformat', 'json'); addParam(u, 'wsfunction', fn);
  Object.entries(params).forEach(([k, v]) => addParam(u, k, v));
  const r = await fetch(u);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  if (j && j.exception) throw new Error(j.message || j.errorcode);
  return j;
}
const retry = (fn) => fn().catch(() => new Promise(r => setTimeout(r, 700)).then(fn));
async function pool(items, n, fn, onProg){
  let i = 0, done = 0; const out = new Array(items.length);
  const worker = async () => { while (i < items.length) { const k = i++; try { out[k] = await fn(items[k]); } catch { out[k] = null; } onProg && onProg(++done, items.length); } };
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, worker));
  return out;
}

const fmt = (ts, o) => new Intl.DateTimeFormat('es-ES', o).format(ts * 1000);
const day = ts => ts ? fmt(ts, { weekday:'short', day:'numeric', month:'short' }) : 'Sin fecha';
const dayLong = ts => fmt(ts, { weekday:'long', day:'numeric', month:'long' });
const hour = ts => ts ? fmt(ts, { hour:'2-digit', minute:'2-digit' }) : '';
const dnum = ts => fmt(ts, { day:'numeric' });
const mon = ts => fmt(ts, { month:'short' }).replace('.', '');
const rtf = new Intl.RelativeTimeFormat('es', { numeric:'auto' });
function rel(ts){

    out.push({ ts, title: e.name, cid: e.course?.id, url: e.url, kind: 'event', done: false });
  }
  for (const a of S.assign) if (liveA(a) && !seenA.has(a.id) && a.duedate > t && !isDone(a)) out.push(itemA(a, a.duedate));
  for (const q of S.quizzes) if (liveQ(q) && q.timeclose > t && !seenQ.has(q.id + ':' + q.timeclose)) out.push(itemQ(q, q.timeclose));

function calItems(y, m){
  const from = new Date(y, m, 1) / 1000 - 7 * 86400, to = new Date(y, m + 1, 1) / 1000 + 14 * 86400, out = [], seen = new Set();
  LA().forEach(a => { if (a.duedate >= from && a.duedate < to) { out.push(itemA(a, a.duedate)); seen.add('a' + a.cmid); } });
  S.quizzes.filter(liveQ).forEach(q => {
    if (q.timeopen >= from && q.timeopen < to && q.timeopen !== q.timeclose) out.push({ ...itemQ(q, q.timeopen), title: 'Abre: ' + q.name });
    if (q.timeclose >= from && q.timeclose < to) out.push({ ...itemQ(q, q.timeclose), title: 'Cierra: ' + q.name });
    seen.add('q' + q.coursemodule);
  });
  TODOS.forEach(td => { if (td.due >= from && td.due < to) out.push({ ts: td.due, title: td.text, cid: td.cid, kind: 'todo', done: td.done, todo: td }); });
  const md = S.months[`${y}-${m + 1}`];
  if (md && md.weeks) {
    const evs = new Map();
    md.weeks.forEach(w => w.days.forEach(d => (d.events || []).forEach(e => evs.set(e.id, e))));
    evs.forEach(e => {
      const u = String(e.url || ''); const ma = u.match(/mod\/(assign|quiz)\/view\.php\?id=(\d+)/);
      if (ma && seen.has((ma[1] === 'assign' ? 'a' : 'q') + ma[2])) return;
      if (ma && ma[1] === 'assign' && S.assignByCmid[ma[2]] && !liveA(S.assignByCmid[ma[2]])) return;
      out.push({ ts: e.timestart, title: e.name, cid: e.course?.id, url: e.url, kind: 'event', done: false });
    });
  }
  return out;
}

/* ================= TAREAS ================= */
function filteredTasks(){
  const q = F.q.trim().toLowerCase();
  return S.assign.filter(a => {
    if (!liveA(a)) return false;
    if (F.course && String(a.course) !== F.course) return false;
    if (q && !(a.name + ' ' + CO(a.course).name).toLowerCase().includes(q)) return false;
    if (!F.state || a.state === 'loading') return true;
    if (F.state === 'todo') return ['pending','draft','overdue'].includes(a.state);
    if (F.state === 'graded') return !!a.gradeText;
    if (F.state === 'pending') return ['pending','draft'].includes(a.state);
    return a.state === F.state;
  });
}
function sortTasks(l, dir = 1){

    : F.sort === 'name' ? a.name.localeCompare(b.name, 'es') : F.sort === 'grade' ? (b.pct ?? -1) - (a.pct ?? -1) : dir * ((a.duedate || 9e12) - (b.duedate || 9e12)));
}

/* ================= CUESTIONARIOS ================= */
R.cuestionarios = () => {
  const Q = S.quizzes.filter(liveQ).filter(q => !F.course || String(q.course) === F.course);
  const st = { open: [], soon: [], closed: [] };
  Q.forEach(q => st[quizState(q)].push(q));
  st.open.sort((a, b) => (a.timeclose || 9e12) - (b.timeclose || 9e12)); st.soon.sort((a, b) => a.timeopen - b.timeopen); st.closed.sort((a, b) => b.timeclose - a.timeclose);
  const card = q => { const b = S.quizBest[q.id], s = quizState(q);
    const g = b?.hasgrade ? `<span class="chip ok">${ic('check')}${num(b.grade)} / ${num(q.grade)}</span>` : b === undefined ? '<span class="chip neu">…</span>'
      : b?.attempted ? `<span class="chip ok" title="Has terminado un intento, pero el profesor no muestra la nota">${ic('check')}Hecho · nota oculta</span>`
      : b?.inprogress ? `<span class="chip warn">${ic('clock')}Intento sin terminar</span>`
      : s === 'closed' ? '<span class="chip bad">Sin hacer</span>' : '<span class="chip warn">Sin hacer</span>';
    return `<div class="trow" style="${cvar(q.course)}" data-href="${esc(quizUrl(q))}"><div class="cbar"></div>
      <div><div class="tn">${esc(q.name)}</div><div class="meta"><span class="dot"></span>${esc(CO(q.course).name)}${q.timelimit ? ' · ' + ic('clock', 'sm') + ' ' + Math.round(q.timelimit / 60) + ' min' : ''}${q.attempts ? ' · ' + q.attempts + (q.attempts === 1 ? ' intento' : ' intentos') : ' · intentos ilimitados'}</div></div>
      <div class="due">${s === 'soon' ? `Abre ${esc(day(q.timeopen))}<small>${hour(q.timeopen)} · ${rel(q.timeopen)}</small>` : q.timeclose ? `Cierra ${esc(day(q.timeclose))}<small>${hour(q.timeclose)} · ${rel(q.timeclose)}</small>` : '<small>Sin cierre</small>'}</div>
      <div class="stc">${g}</div><div class="gr faint">${q.grade ? 'sobre ' + num(q.grade) : ''}</div><span class="ext faint">${ic('external', 'sm')}</span></div>`; };
  const sec = (l, c, arr) => arr.length ? `<div class="sect-t"><span class="dot ${c}"></span>${l}<span class="badge">${arr.length}</span></div><div class="card tgroup">${arr.map(card).join('')}</div>` : '';
  return `<div class="toolbar"><select class="inp" data-f="course">${courseOpts(F.course)}</select></div>` +
    (Q.length ? sec('Abiertos ahora', 'ok', st.open) + sec('Próximamente', 'info', st.soon) + sec('Cerrados', 'neu', st.closed) : `<div class="card">${emptyBlock('quiz', 'No hay cuestionarios')}</div>`);
};

/* ================= NOTAS ================= */
R.notas = () => {
  const A = LA(), g = A.filter(a => a.pct != null).sort((a, b) => (a.gradedAt || a.duedate) - (b.gradedAt || b.duedate));
  const avg = g.length ? g.reduce((s, a) => s + a.pct, 0) / g.length : null;
  const best = g.reduce((m, a) => !m || a.pct > m.pct ? a : m, null);
  const passed = g.filter(a => a.pct >= 50).length;
  const qb = S.quizzes.filter(q => liveQ(q) && qDone(q));
  const kp = `<div class="kpis" style="margin-top:0">
    <div class="card kpi" style="--c:var(--accent)"><div class="ico">${ic('award','lg')}</div><div><div class="n">${avg == null ? '—' : num(avg / 10, 2)}</div><div class="l">Media de tareas (/10)</div></div></div>
    <div class="card kpi" style="--c:var(--ok)"><div class="ico">${ic('check','lg')}</div><div><div class="n">${passed}/${g.length}</div><div class="l">Tareas aprobadas</div></div></div>
    <div class="card kpi" style="--c:var(--warn)"><div class="ico">${ic('flame','lg')}</div><div><div class="n">${best ? num(best.pct / 10, 1) : '—'}</div><div class="l">${best ? 'Mejor: ' + esc(best.name.slice(0, 28)) : 'Mejor nota'}</div></div></div>
    <div class="card kpi" style="--c:var(--info)"><div class="ico">${ic('quiz','lg')}</div><div><div class="n">${qb.length}</div><div class="l">Cuestionarios hechos</div></div></div></div>`;
  let chart = '';
  if (g.length) {
    const W = 760, H = 230, pl = 34, pb = 26, bw = Math.min(34, (W - pl - 10) / g.length - 6), step = (W - pl - 10) / g.length;
    let s = '';
    [0, 25, 50, 75, 100].forEach(v => { const y = H - pb - v / 100 * (H - pb - 14); s += `<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" style="stroke:${v === 50 ? 'var(--faint)' : 'var(--border)'}" stroke-dasharray="${v === 50 ? '5 4' : '3 5'}"/><text x="${pl - 6}" y="${y + 4}" text-anchor="end" style="fill:var(--faint);font-size:11px">${v / 10}</text>`; });
    g.forEach((a, i) => { const h = Math.max(2, a.pct / 100 * (H - pb - 14)); const x = pl + i * step + (step - bw) / 2;
      s += `<rect x="${x}" y="${H - pb - h}" width="${bw}" height="${h}" rx="5" style="fill:${CO(a.course).color};cursor:pointer" data-task="${a.id}"><title>${esc(a.name)} — ${esc(a.gradeText)}</title></rect>`; });
    chart = `<div class="card"><div class="ch"><h3>${ic('chart')}Evolución de tus notas</h3><span class="muted" style="font-size:12.5px">Sobre 10 · cada barra es una tarea</span></div><div class="cb"><svg class="chart" viewBox="0 0 ${W} ${H}">${s}</svg>
      <div class="row wrap" style="gap:12px;margin-top:8px">${[...new Set(g.map(a => a.course))].map(id => `<span class="row" style="gap:6px;font-size:12.5px"><span class="dot" style="${cvar(id)}"></span>${esc(CO(id).short)}</span>`).join('')}</div></div></div>`;
  }
  const ov = Object.fromEntries(S.grades.map(x => [x.courseid, x]));
  const cards = S.courses.map(c => { const it = S.gradeItems[c.id];
    const body = !it ? loadingBlock() : it.error ? `<div class="err" style="padding:12px 18px">${esc(it.error)}</div>` : !it.length ? emptyBlock('chart', 'Sin elementos de calificación') :
      `<table class="gtable">${it.map(x => { const cls = x.itemtype === 'course' ? 'tot' : x.itemtype === 'category' ? 'cat' : ''; const p = parseFloat(String(x.percentageformatted || '').replace(',', '.'));
        const fb = txt(x.feedback);
        return `<tr class="${cls}"><td style="padding-left:18px">${esc(x.itemtype === 'course' ? 'Total del módulo' : (x.itemname || 'Categoría'))}${fb ? `<span class="fb">${ic('message','sm')} ${esc(fb)}</span>` : ''}</td>
          <td class="pb">${isNaN(p) ? '' : `<div class="bar" style="--c:${p >= 50 ? 'var(--ok)' : 'var(--bad)'}"><i style="width:${p}%"></i></div>`}</td>
          <td class="num"><b>${esc(txt(x.gradeformatted) || '—')}</b></td><td class="num rng faint" style="padding-right:18px">${esc(txt(x.rangeformatted))}</td></tr>`; }).join('')}</table>`;
    return `<details class="card gc" style="--c:${c.color}" ${F.openGrade === c.id ? 'open' : ''} data-gc="${c.id}"><summary><span class="dot" style="width:12px;height:12px"></span><div><b>${esc(c.name)}</b><div class="meta">${it && it.length ? it.filter(x => x.itemtype === 'mod' && x.graderaw != null).length + ' calificaciones' : 'Pulsa para ver el desglose'}</div></div>
      <span class="big">${esc(txt(ov[c.id]?.grade) || '—')}</span>${ic('chevR')}</summary>${body}</details>`; }).join('<div style="height:10px"></div>');
  return kp + chart + `<div class="sect-t">${ic('book')}Por módulo</div>` + cards;
};

function renderSections(cid, q){
  const data = S.contents[cid]; if (!data) return '';

      .filter(m => !q || (m.name + ' ' + (m.contents || []).map(f => f.filename).join(' ') + ' ' + sec.name + ' ' + txt(m.description)).toLowerCase().includes(q));
    if (!mods.length) return '';
    return `<details class="card sec" ${q || si < 4 ? 'open' : ''}><summary>${ic('chevR', 'chev')}<span class="sp">${esc(sec.name)}</span>${F.mall ? `<span class="chip" style="${cvar(cid)}">${esc(CO(cid).short)}</span>` : ''}<span class="badge">${mods.length}</span></summary>
      ${mods.map(m => {
        if (m.modname === 'label') return `<div class="mod"><div class="rich muted" style="font-size:13.5px">${safeHTML(m.description)}</div></div>`;
        const files = m.modname === 'page' ? [] : (m.contents || []).filter(f => f.type === 'file');
        const asg = m.modname === 'assign' && S.assignByCmid[m.id];

          <div class="row wrap" style="gap:8px"><span class="lnk" data-task="${asg.id}">${esc(m.name)}</span>${chip(asg.state)}${asg.gradeText ? `<span class="chip acc">${esc(asg.gradeText)}</span>` : ''}</div>

        const ext = m.modname === 'url' && m.contents?.[0]?.fileurl;

          ${m.modname === 'resource' && files.length === 1 ? `<div class="files"><div class="file">${ftile(files[0].filename)}<span class="fs">${esc(files[0].filename)} · ${size(files[0].filesize || 0)}${files[0].timemodified ? ' · ' + esc(day(files[0].timemodified)) : ''}</span></div></div>` : ''}
        </div>${files.length ? `<a class="btn icon sm ghost" href="${esc(tok(files[0].fileurl))}" title="Descargar">${ic('download')}</a>` : ''}</div>`; }).join('')}</details>`;
  }).join('');
}

/* ================= exportar ================= */
function icsExport(){
  const dt = ts => new Date(ts * 1000).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const e = s => String(s).replace(/[\\;,]/g, m => '\\' + m).replace(/\r?\n/g, '\\n');
  const L = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//MiAulaVirtual//ES','CALSCALE:GREGORIAN','X-WR-CALNAME:Aula Virtual'];
  const ev = (uid, ts, sum, url, desc) => { L.push('BEGIN:VEVENT', 'UID:' + uid + '@miaulavirtual', 'DTSTAMP:' + dt(nowS()), 'DTSTART:' + dt(ts - 1800), 'DTEND:' + dt(ts), 'SUMMARY:' + e(sum), ...(url ? ['URL:' + url] : []), 'DESCRIPTION:' + e(desc || ''), 'BEGIN:VALARM', 'TRIGGER:-P1D', 'ACTION:DISPLAY', 'DESCRIPTION:' + e(sum), 'END:VALARM', 'END:VEVENT'); };
  const from = nowS() - 30 * 86400; let n = 0;
  LA().forEach(a => { if (a.duedate > from) { ev('assign-' + a.id, a.duedate, `[${CO(a.course).short}] ${a.name}`, assignUrl(a), STATES[a.state]?.[0] || ''); n++; } });
  S.quizzes.filter(liveQ).forEach(q => { if (q.timeclose > from) { ev('quiz-' + q.id, q.timeclose, `[${CO(q.course).short}] Cierra: ${q.name}`, quizUrl(q), 'Cuestionario'); n++; } });
  TODOS.forEach(t => { if (t.due && !t.done) { ev('todo-' + t.id, t.due, t.text, '', 'Mi lista'); n++; } });
  L.push('END:VCALENDAR');
  download('aula-virtual.ics', L.join('\r\n'), 'text/calendar;charset=utf-8');
  toast(`Calendario exportado con ${n} eventos`);
}
function csvExport(){
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const rows = [['Módulo','Tarea','Fecha de entrega','Estado','Nota','Porcentaje','Enlace']];
  LA().sort((a, b) => (a.duedate || 0) - (b.duedate || 0)).forEach(a => rows.push([CO(a.course).name, a.name, a.duedate ? new Date(a.duedate * 1000).toLocaleString('es-ES') : '', STATES[a.state]?.[0] || '', a.gradeText || '', a.pct != null ? Math.round(a.pct) + '%' : '', assignUrl(a)]));
  download('tareas-aula-virtual.csv', '﻿' + rows.map(r => r.map(q).join(';')).join('\r\n'), 'text/csv;charset=utf-8');
  toast('Tareas exportadas');
}

function searchIndex(){

  LA().forEach(a => out.push({ k: 'Tarea', t: a.name, s: CO(a.course).name + (a.duedate ? ' · ' + day(a.duedate) : ''), c: a.course, task: a.id, i: 'clipboard' }));
  S.quizzes.filter(liveQ).forEach(q => out.push({ k: 'Cuestionario', t: q.name, s: CO(q.course).name, c: q.course, href: quizUrl(q), i: 'quiz' }));
  S.disc.forEach(d => out.push({ k: 'Anuncio', t: d.subject || d.name, s: CO(d.course).name, c: d.course, go: '#/anuncios', i: 'megaphone' }));
  Object.entries(S.contents).forEach(([cid, secs]) => Array.isArray(secs) && secs.forEach(sec => (sec.modules || []).forEach(m => { if (m.modname === 'label') return;
    out.push({ k: MODS[m.modname] || 'Material', t: m.name, s: CO(cid).name + ' · ' + sec.name, c: cid, href: m.modname === 'url' && m.contents?.[0]?.fileurl || m.url, i: MODIC[m.modname] || 'file' });
    (m.contents || []).filter(f => f.type === 'file' && f.filename !== m.name).forEach(f => out.push({ k: 'Archivo', t: f.filename, s: CO(cid).name + ' · ' + m.name, c: cid, href: tok(f.fileurl), i: 'file' })); })));
  PAGES.filter(p => p[1]).forEach(p => out.push({ k: 'Sección', t: p[1], s: 'Ir a ' + p[1], go: '#/' + p[0], i: p[2] }));
  return out;
}
let SR = [], SRi = 0;
function openSearch(){ $('#searchModal').hidden = false; $('#sInput').value = ''; runSearch(); setTimeout(() => $('#sInput').focus(), 10);
  if (S.info && S.courses.some(c => !S.contents[c.id])) pool(S.courses.filter(c => !S.contents[c.id]), 3, async c => { try { S.contents[c.id] = await api('core_course_get_contents', { courseid: c.id }); } catch {} }).then(() => { if (!$('#searchModal').hidden) runSearch(); }); }
function runSearch(){
  const q = $('#sInput').value.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const idx = searchIndex();
  SR = q ? idx.filter(x => q.split(/\s+/).every(w => norm(x.t + ' ' + x.s).includes(w))).slice(0, 40) : idx.filter(x => x.k === 'Sección' || x.k === 'Módulo').slice(0, 25);

function applyTheme(){

function tick(){
  $$('[data-cd]').forEach(el => { let d = Math.max(0, Math.floor(+el.dataset.cd - nowS()));
    const v = { d: Math.floor(d / 86400), h: Math.floor(d % 86400 / 3600), m: Math.floor(d % 3600 / 60), s: d % 60 };
    $$('[data-u]', el).forEach(b => b.textContent = String(v[b.dataset.u]).padStart(b.dataset.u === 'd' ? 1 : 2, '0')); });

function hideTask(id, hide){ id = +id; CFG.hidden = CFG.hidden.filter(x => x !== id); if (hide) CFG.hidden.push(id); saveCfg(); buildNav(); renderPage(); if ($('#drawer').classList.contains('open')) openTask(id); toast(hide ? 'Tarea oculta (puedes recuperarla en Ajustes)' : 'Tarea visible de nuevo'); }

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act],[data-task],[data-href],[data-go],[data-day],[data-sr],[data-preset]');
  if (!t) return;
  if (t.dataset.preset) { F.state = t.dataset.preset; }
  if (t.dataset.sr != null) return pickSearch(+t.dataset.sr);
  if (t.dataset.day && !t.dataset.act) { F.cal.sel = t.dataset.day; return renderPage(); }
  if (t.dataset.task && !t.dataset.act) { if (e.target.closest('a[href]')) return; return openTask(+t.dataset.task); }
  if (t.dataset.href && !t.dataset.act) { const h = t.dataset.href; if (h.startsWith('#')) location.hash = h; else window.open(h, '_blank', 'noopener'); return; }
  if (t.dataset.go && !t.dataset.act) { location.hash = '#/' + t.dataset.go; return; }
  const a = t.dataset.act; if (!a || t.tagName === 'FORM') return;
  if (a === 'mone') { F.mall = false; return; }
  e.preventDefault(); e.stopPropagation();
  const id = t.dataset.id, v = t.dataset.v;
  switch (a) {
    case 'menu': $('#side').classList.add('open'); $('#scrim').classList.add('on'); break;
    case 'close': closeAll(); break;
    case 'closesearch': if (e.target === t) $('#searchModal').hidden = true; break;
    case 'search': openSearch(); break;
    case 'refresh': S.contents = {}; S.gradeItems = {}; S.months = {}; S.conv = {}; loadAll(); break;
    case 'theme': { const dark = document.documentElement.getAttribute('data-theme') === 'dark' || (CFG.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches); CFG.theme = dark ? 'light' : 'dark'; saveCfg(); applyTheme(); if (route()[0] === 'ajustes') renderPage(); break; }
    case 'setTheme': CFG.theme = v; saveCfg(); applyTheme(); renderPage(); break;
    case 'accent': CFG.accent = v; saveCfg(); applyTheme(); renderPage(); break;
    case 'ics': icsExport(); break;
    case 'csv': csvExport(); break;
    case 'view': CFG.view = v; saveCfg(); renderPage(); break;
    case 'preset': F.state = v; renderPage(); break;
    case 'hideTask': hideTask(id, true); break;
    case 'unhideTask': hideTask(id, false); break;
    case 'unhideAll': CFG.hidden = []; saveCfg(); buildNav(); renderPage(); toast('Todas las tareas visibles'); break;
    case 'courseTasks': F.course = String(id); F.state = ''; location.hash = '#/tareas'; break;
    case 'calPrev': case 'calNext': { const d = new Date(F.cal.y, F.cal.m + (a === 'calNext' ? 1 : -1), 1); F.cal.y = d.getFullYear(); F.cal.m = d.getMonth(); F.cal.sel = dkey(d); renderPage(); break; }
    case 'calToday': { const d = new Date(); F.cal = { y: d.getFullYear(), m: d.getMonth(), sel: dkey(d) }; renderPage(); break; }
    case 'todoForDay': F.todoDay = t.dataset.day; location.hash = '#/milista'; setTimeout(() => $('#tdText')?.focus(), 50); break;
    case 'todoFromTask': { const as = S.assignById[id]; TODOS.push({ id: Date.now(), text: as.name, due: as.duedate || 0, cid: as.course, done: false }); saveTodos(); buildNav(); toast('Añadida a Mi lista'); break; }
    case 'toggleTodo': { const x = TODOS.find(x => x.id === +id); if (x) x.done = !x.done; saveTodos(); buildNav(); renderPage(); break; }
    case 'delTodo': TODOS = TODOS.filter(x => x.id !== +id); saveTodos(); buildNav(); renderPage(); break;
    case 'clearDone': TODOS = TODOS.filter(x => !x.done); saveTodos(); buildNav(); renderPage(); break;
    case 'tf': F.todoFilter = v; renderPage(); break;
    case 'nf': F.notif = v; renderPage(); break;
    case 'readOne': try { await api('core_message_mark_notification_read', { notificationid: id, timeread: Math.floor(nowS()) }); const n = S.notifs.find(n => n.id === +id); if (n) n.read = true; buildNav(); renderPage(); } catch (err) { toast('No se pudo: ' + err.message); } break;
    case 'markAll': try { await api('core_message_mark_all_notifications_as_read', { useridto: S.info.userid }); S.notifs.forEach(n => n.read = true); buildNav(); renderPage(); toast('Todo marcado como leído'); } catch (err) { toast('No se pudo: ' + err.message); } break;
    case 'expand': { const el = document.getElementById(id); el.classList.toggle('clamp'); t.textContent = el.classList.contains('clamp') ? 'Leer más' : 'Leer menos'; break; }
    case 'conv': F.conv = +id; renderPage(); break;
    case 'convBack': F.conv = null; renderPage(); break;
    case 'resetCourses': CFG.cnames = {}; CFG.cshort = {}; CFG.ccolors = {}; saveCfg(); decorateCourses(); buildNav(); renderPage(); toast('Módulos restablecidos'); break;
    case 'logout': logout(); break;
  }
});
document.addEventListener('submit', async e => {
  const f = e.target.closest('[data-act-submit]'); if (!f) return;
  e.preventDefault();
  if (f.dataset.actSubmit === 'addTodo') {
    const text = $('#tdText').value.trim(); if (!text) return;
    const dv = $('#tdDate').value;
    TODOS.push({ id: Date.now(), text, due: dv ? Math.floor(new Date(dv) / 1000) : 0, cid: +$('#tdCourse').value || 0, done: false });
    F.todoDay = null; saveTodos(); buildNav(); renderPage(); toast('Añadida a Mi lista'); $('#tdText')?.focus();
  }
  if (f.dataset.actSubmit === 'send') {
    const c = S.convs.find(x => x.id === F.conv), text = $('#replyTxt').value.trim(); if (!c || !text) return;
    const to = (c.members || [])[0]?.id;
    try { await api('core_message_send_instant_messages', { messages: [{ touserid: to, text, textformat: 2 }] }); delete S.conv[c.id]; renderPage(); toast('Mensaje enviado'); }
    catch (err) { toast('No se pudo enviar: ' + err.message); }
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.f) {
    const k = el.dataset.f;
    if (k === 'accent') { CFG.accent = el.value; saveCfg(); applyTheme(); return; }
    if (k === 'hideOld') { CFG.hideOld = el.checked; saveCfg(); buildNav(); renderPage(); return; }
    if (k === 'refresh') { CFG.refresh = +el.value; saveCfg(); setRefresh(); toast(+el.value ? 'Actualización automática activada' : 'Actualización automática desactivada'); return; }
    if (k === 'mall') { F.mall = el.checked; renderPage(); return; }
    F[k] = el.type === 'checkbox' ? el.checked : el.value;
    renderPage(); return;
  }
  if (el.dataset.cc) { CFG.ccolors[el.dataset.cc] = el.value; saveCfg(); decorateCourses(); buildNav(); return; }
  if (el.dataset.cn) { if (el.value.trim()) CFG.cnames[el.dataset.cn] = el.value.trim(); else delete CFG.cnames[el.dataset.cn]; saveCfg(); decorateCourses(); return; }
  if (el.dataset.cs) { if (el.value.trim()) CFG.cshort[el.dataset.cs] = el.value.trim(); else delete CFG.cshort[el.dataset.cs]; saveCfg(); decorateCourses(); return; }
  if (el.id === 'sInput') runSearch();
});
document.addEventListener('toggle', e => { const d = e.target; if (d.dataset && d.dataset.gc) F.openGrade = d.open ? +d.dataset.gc : (F.openGrade === +d.dataset.gc ? null : F.openGrade); }, true);
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); if (!$('#app').hidden) openSearch(); return; }
  if (!$('#searchModal').hidden) {
    if (e.key === 'Escape') $('#searchModal').hidden = true;
    else if (e.key === 'ArrowDown') { e.preventDefault(); SRi = Math.min(SR.length - 1, SRi + 1); drawSearch(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); SRi = Math.max(0, SRi - 1); drawSearch(); }
    else if (e.key === 'Enter') { e.preventDefault(); pickSearch(SRi); }
    return;
  }
  if (e.key === 'Escape') closeAll();
  if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && !$('#app').hidden) { e.preventDefault(); openSearch(); }
});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);

/* ================= login ================= */
function showLogin(msg){ $('#app').hidden = true; $('#login').hidden = false; $('#siteIn').value = SITE; $('#loginErr').textContent = msg || ''; }
function logout(){ store.del('mv_token'); TOKEN = null; S.info = null; closeAll();
  showLogin(window.MOODLE_TOKEN ? 'Sesión cerrada. Ojo: config.js sigue teniendo tu token; bórralo de ese archivo si no quieres entrar automáticamente.' : ''); }
$('#loginForm').addEventListener('submit', e => {
  e.preventDefault();
  SITE = $('#siteIn').value.trim().replace(/\/(my|login|course|mod|user|admin|index\.php)(\/.*|\?.*)?$/, '').replace(/\/+$/, '');
  TOKEN = $('#tokenIn').value.replace(/[^0-9a-f]/gi, '');
  if (TOKEN.length !== 32) { $('#loginErr').textContent = `El token debe tener 32 caracteres (letras a-f y números). Has pegado ${TOKEN.length}.`; return; }
  $('#loginErr').textContent = 'Conectando…';
  store.set('mv_site', SITE); store.set('mv_token', TOKEN, $('#remember').checked);
  loadAll();
});

/* ================= arranque ================= */
$('.menu-btn').innerHTML = ic('menu'); $('.sico').innerHTML = ic('search', 'sm'); $('#sIco').innerHTML = ic('search');
$('#refreshBtn').innerHTML = ic('refresh');
applyTheme(); setRefresh();
if (TOKEN) { buildNav(); loadAll(); } else showLogin();
</script>
</body>
</html>
